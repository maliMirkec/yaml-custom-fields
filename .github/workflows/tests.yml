name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wp }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
        wp: ['latest']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: ''

    steps:
      # Actions are pinned to commit SHAs (tag in the trailing comment)
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Build scoped dependencies
        run: |
          chmod +x build-scoped.sh
          ./build-scoped.sh

      - name: Run unit tests
        run: composer test:unit

      - name: Download WordPress
        run: |
          mkdir -p "$WP_CORE_DIR"
          curl -sL "https://wordpress.org/${{ matrix.wp }}.tar.gz" | tar -xz --strip-components=1 -C "$WP_CORE_DIR"

      - name: Run integration tests
        run: composer test:integration
