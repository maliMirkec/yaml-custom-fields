name: Deploy to WordPress.org

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs (tag in the trailing comment)
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'

      # Dev dependencies are needed for PHPUnit and PHP-Scoper; they are not shipped
      # (build-scoped.sh scopes a separate --no-dev install, and .distignore excludes vendor/)
      - name: Install Composer dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Run unit tests
        run: composer test:unit

      - name: Build scoped dependencies
        run: |
          chmod +x build-scoped.sh
          ./build-scoped.sh

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0 (stable)
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: yaml-custom-fields
